apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: ClusterIP
  selector:
    component: order
  ports:
    - port: 5000
      name: http
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      component: order
  template:
    metadata:
      labels:
        component: order
    spec:
      containers:
        - name: order
          image: order:latest
          resources:
            limits:
              memory: "1Gi"
              cpu: "1"
            requests:
              memory: "1Gi"
              cpu: "1"
          command: ["gunicorn"]
          args: ["-c", "gunicorn.conf.py", "-b", "0.0.0.0:5000", "app:app"]
          ports:
            - containerPort: 5000
          env:
            - name: USER_SERVICE_URL
              value: "user-service"
            - name: STOCK_SERVICE_URL
              value: "stock-service"
            - name: STOCK_GRPC_HOST
              value: "stock-service"
            - name: STOCK_GRPC_PORT
              value: "50051"
            - name: PAYMENT_GRPC_HOST
              value: "user-service"
            - name: PAYMENT_GRPC_PORT
              value: "50052"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: TRANSACTION_MODE
              value: "saga"
            - name: SAGA_TIMEOUT_SECONDS
              value: "10"
            - name: REDIS_HOST
              value: order-db
            - name: REDIS_PORT
              value: '6379'
            - name: REDIS_PASSWORD
              value: "redis"
            - name: REDIS_DB
              value: "0"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: order-db
spec:
  type: ClusterIP
  selector:
    component: order-db
  ports:
    - port: 6379
      name: redis
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-db
spec:
  serviceName: order-db
  replicas: 1
  selector:
    matchLabels:
      component: order-db
  template:
    metadata:
      labels:
        component: order-db
    spec:
      containers:
        - name: order-db
          image: redis:7.2-bookworm
          command: ["redis-server", "--requirepass", "redis", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: order-db-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: order-db-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
