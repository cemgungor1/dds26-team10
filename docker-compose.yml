version: "3"

x-redis-replica: &redis-replica
  image: redis:7.2-bookworm
  restart: unless-stopped
  command:
    - sh
    - -lc
    - |
      exec redis-server /usr/local/etc/redis/redis.conf \
        --replicaof "$$MASTER_HOST" "$$MASTER_PORT" \
        --masterauth "$$REDIS_PASSWORD" \
        --requirepass "$$REDIS_PASSWORD"
  environment:
    REDIS_PASSWORD: redis
    MASTER_PORT: "6379"   # default, can override per service
  volumes:
    - ./master/redis.conf:/usr/local/etc/redis/redis.conf:ro

services:
  gateway:
    image: nginx:1.25-bookworm
    restart: unless-stopped
    volumes:
      - ./gateway_nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - order-service
      - stock-service
      - payment-service

  order-service:
    build: ./order
    image: order:latest
    restart: unless-stopped
    environment:
      - STOCK_GRPC_HOST=stock-service
      - STOCK_GRPC_PORT=50051
      - PAYMENT_GRPC_HOST=payment-service
      - PAYMENT_GRPC_PORT=50052
      - GATEWAY_URL=http://gateway:80
    command: gunicorn -b 0.0.0.0:5000 -w 2 --timeout 30 --log-level=info app:app
    env_file:
      - env/order_redis.env
    depends_on:
      - redis-master-order
      - redis-sentinel-order

  redis-master-order:
    image: redis:7.2-bookworm
    container_name: redis-master-order
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-order-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  redis-replica1-order:
    <<: *redis-replica
    container_name: redis-replica1-order
    depends_on: [redis-master-order]
    environment:
      MASTER_HOST: redis-master-order
      REDIS_PASSWORD: redis
      MASTER_PORT: "6379"
    volumes:
      - redis-order-replica1-data:/data
      - ./config/redis-replica.conf:/usr/local/etc/redis/redis.conf:ro

  redis-replica2-order:
    <<: *redis-replica
    container_name: redis-replica2-order
    depends_on: [redis-master-order]
    environment:
      MASTER_HOST: redis-master-order
      REDIS_PASSWORD: redis
      MASTER_PORT: "6379"
      #MASTER_PORT: "6379"
    volumes:
      - redis-order-replica2-data:/data
      - ./config/redis-replica.conf:/usr/local/etc/redis/redis.conf:ro

  redis-sentinel-order:
    image: redis:7.2-bookworm
    container_name: redis-sentinel-order
    restart: unless-stopped
    depends_on:
      - redis-master-order
      - redis-replica1-order
      - redis-replica2-order
    ports:
      - "26379:26379"
    volumes:
      - redis-order-sentinel:/data
      - ./config/order-sentinel.conf:/etc/redis/sentinel-base.conf:ro
    command:
      - sh
      - -lc
      - |
        cp /etc/redis/sentinel-base.conf /data/sentinel.conf 2>/dev/null || true
        exec redis-sentinel /data/sentinel.conf

  stock-service:
    build: ./stock
    image: stock:latest
    restart: unless-stopped
    command: gunicorn -b 0.0.0.0:5000 -w 2 --timeout 30 --log-level=info app:app
    env_file:
      - env/stock_redis.env
    depends_on:
      - redis-master-stock
      - redis-sentinel-stock

  redis-master-stock:
    image: redis:7.2-bookworm
    container_name: redis-master-stock
    restart: unless-stopped
    #ports:
    #  - "6379:6379"
    volumes:
      - redis-stock-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  redis-replica1-stock:
    <<: *redis-replica
    container_name: redis-replica1-stock
    depends_on: [redis-master-stock]
    environment:
      MASTER_HOST: redis-master-stock
      REDIS_PASSWORD: redis
      MASTER_PORT: "6379"
    volumes:
      - redis-stock-replica1-data:/data
      - ./config/redis-replica.conf:/usr/local/etc/redis/redis.conf:ro

  redis-replica2-stock:
    <<: *redis-replica
    container_name: redis-replica2-stock
    depends_on: [redis-master-stock]
    environment:
      MASTER_HOST: redis-master-stock
      REDIS_PASSWORD: redis
      MASTER_PORT: "6379"
      #MASTER_PORT: "6379"
    volumes:
      - redis-stock-replica2-data:/data
      - ./config/redis-replica.conf:/usr/local/etc/redis/redis.conf:ro

  redis-sentinel-stock:
    image: redis:7.2-bookworm
    container_name: redis-sentinel-stock
    restart: unless-stopped
    depends_on:
      - redis-master-stock
      - redis-replica1-stock
      - redis-replica2-stock
    ports:
      - "26380:26379"
    volumes:
      - redis-stock-sentinel:/data
      - ./config/stock-sentinel.conf:/etc/redis/sentinel-base.conf:ro
    command:
      - sh
      - -lc
      - |
        cp /etc/redis/sentinel-base.conf /data/sentinel.conf 2>/dev/null || true
        exec redis-sentinel /data/sentinel.conf


  payment-service:
    build: ./payment
    image: user:latest
    restart: unless-stopped
    command: gunicorn -b 0.0.0.0:5000 -w 2 --timeout 30 --log-level=info app:app
    env_file:
      - env/payment_redis.env
    depends_on:
      - redis-master-payment
      - redis-sentinel-payment

  redis-master-payment:
    image: redis:7.2-bookworm
    container_name: redis-master-payment
    restart: unless-stopped
    #ports:
    #  - "6379:6379"
    volumes:
      - redis-payment-data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  redis-replica1-payment:
    <<: *redis-replica
    container_name: redis-replica1-payment
    depends_on: [redis-master-payment]
    environment:
      MASTER_HOST: redis-master-payment
      REDIS_PASSWORD: redis
      MASTER_PORT: "6379"
    volumes:
      - redis-payment-replica1-data:/data
      - ./config/redis-replica.conf:/usr/local/etc/redis/redis.conf:ro

  redis-replica2-payment:
    <<: *redis-replica
    container_name: redis-replica2-payment
    depends_on: [redis-master-payment]
    environment:
      MASTER_HOST: redis-master-payment
      REDIS_PASSWORD: redis
      MASTER_PORT: "6379"
    volumes:
      - redis-payment-replica2-data:/data
      - ./config/redis-replica.conf:/usr/local/etc/redis/redis.conf:ro

  redis-sentinel-payment:
    image: redis:7.2-bookworm
    container_name: redis-sentinel-payment
    restart: unless-stopped
    depends_on:
      - redis-master-payment
      - redis-replica1-payment
      - redis-replica2-payment
    ports:
      - "26381:26379"
    volumes:
      - redis-payment-sentinel:/data
      - ./config/payment-sentinel.conf:/etc/redis/sentinel-base.conf:ro
    command:
      - sh
      - -lc
      - |
        cp /etc/redis/sentinel-base.conf /data/sentinel.conf 2>/dev/null || true
        exec redis-sentinel /data/sentinel.conf


volumes:
  redis-order-data:
  redis-order-replica1-data:
  redis-order-replica2-data:
  redis-order-sentinel:
  redis-stock-data:
  redis-stock-replica1-data:
  redis-stock-replica2-data:
  redis-stock-sentinel:
  redis-payment-data:
  redis-payment-replica1-data:
  redis-payment-replica2-data:
  redis-payment-sentinel:
