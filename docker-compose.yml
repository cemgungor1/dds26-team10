version: "3"

x-redis-replica: &redis-replica
  image: redis:7.2-bookworm
  command: >
    sh -lc 'exec redis-server
      --replicaof "$$MASTER_HOST" "$$MASTER_PORT"
      --masterauth "$$REDIS_PASSWORD"
      --requirepass "$$REDIS_PASSWORD"'
  environment:
    REDIS_PASSWORD: redis
    MASTER_PORT: "6379"   # default, can override per service

services:
  gateway:
    image: nginx:1.25-bookworm
    volumes:
      - ./gateway_nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - order-service
      - stock-service
      - payment-service

  order-service:
    build: ./order
    image: order:latest
    environment:
      - GATEWAY_URL=http://gateway:80
    command: gunicorn -b 0.0.0.0:5000 -w 2 --timeout 30 --log-level=info app:app
    env_file:
      - env/order_redis.env
    depends_on:
      - redis-sentinel-order

  redis-master-order:
    image: redis:7.2-bookworm
    container_name: redis-master-order
    ports:
      - "6379:6379"
    volumes:
      - ./master/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  redis-replica1-order:
    <<: *redis-replica
    container_name: redis-replica1-order
    depends_on: [redis-master-order]
    environment:
      MASTER_HOST: redis-master-order

  redis-replica2-order:
    <<: *redis-replica
    container_name: redis-replica2-order
    depends_on: [redis-master-order]
    environment:
      MASTER_HOST: redis-master-order
      #MASTER_PORT: "6379"

  redis-sentinel-order:
    image: redis:7.2-bookworm
    container_name: redis-sentinel-order
    depends_on:
      - redis-master-order
      - redis-replica1-order
      - redis-replica2-order
    ports:
      - "26379:26379"
    command:
      - sh
      - -lc
      - |
        set -eu
        mkdir -p /etc/redis
        printf "%s\n" \
          "bind 0.0.0.0" \
          "protected-mode no" \
          "port 26379" \
          "sentinel resolve-hostnames yes" \
          "sentinel announce-hostnames yes" \
          "sentinel monitor order-master redis-master-order 6379 1" \
          "sentinel auth-pass order-master redis" \
          "sentinel down-after-milliseconds order-master 800" \
          "sentinel failover-timeout order-master 2000" \
          > /etc/redis/sentinel.conf
        exec redis-sentinel /etc/redis/sentinel.conf

  stock-service:
    build: ./stock
    image: stock:latest
    command: gunicorn -b 0.0.0.0:5000 -w 2 --timeout 30 --log-level=info app:app
    env_file:
      - env/stock_redis.env
    depends_on:
      - redis-sentinel-stock

  redis-master-stock:
    image: redis:7.2-bookworm
    container_name: redis-master-stock
    #ports:
    #  - "6379:6379"
    volumes:
      - ./master/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

  redis-replica1-stock:
    <<: *redis-replica
    container_name: redis-replica1-stock
