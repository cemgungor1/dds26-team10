version: "3"
# Demo medium configuration: 50 total containers
# Fixed infrastructure (6): gateway=1, order-db=1, stock-db=1, payment-db=1, zookeeper=1, kafka=1
# Scaled services (44): split as order-service=15, stock-service=15, payment-service=14
# Usage: docker compose -f docker-compose.yml -f docker-compose.demo_medium.yml up -d

services:
  order-service:
    deploy:
      mode: replicated
      replicas: 15

  stock-service:
    deploy:
      mode: replicated
      replicas: 15

  payment-service:
    deploy:
      mode: replicated
      replicas: 14

  kafka:
    environment:
      KAFKA_NUM_PARTITIONS: 15
