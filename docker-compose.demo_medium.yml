version: "3"
# Demo medium configuration: 50 total containers
# Fixed infrastructure (14): gateway=1, order-db=3, stock-db=3, payment-db=3, zookeeper=1, kafka=1
# Note: DB shards (order-db-1/2/3, stock-db-1/2/3, payment-db-1/2/3) are defined
# in the base docker-compose.yml and do not need overrides here.
# Scaled services (44): split as order-service=15, stock-service=15, payment-service=14
# Usage: docker compose -f docker-compose.yml -f docker-compose.demo_medium.yml up -d

services:
  order-service:
    deploy:
      mode: replicated
      replicas: 14

  stock-service:
    deploy:
      mode: replicated
      replicas: 14

  payment-service:
    deploy:
      mode: replicated
      replicas: 13

  kafka:
    environment:
      KAFKA_NUM_PARTITIONS: 15
