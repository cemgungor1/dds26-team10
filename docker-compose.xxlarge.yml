version: "3"
# XXLarge configuration: 20 instances each
# Usage: docker compose -f docker-compose.yml -f docker-compose.xxlarge.yml up -d

services:
  order-service:
    deploy:
      mode: replicated
      replicas: 20

  stock-service:
    deploy:
      mode: replicated
      replicas: 20

  payment-service:
    deploy:
      mode: replicated
      replicas: 20
