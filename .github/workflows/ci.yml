name: CI

on:
  workflow_dispatch:
  push:
    branches: [kafka-saga-v2, orchestrator]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and start services
        run: |
          docker compose down -v --remove-orphans || true
          docker compose build
          docker compose up -d

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for services
        run: python benchmarks/BCT/wait_for_services.py

      - name: Run core tests
        working-directory: benchmarks/BCT
        run: |
          python -m unittest microservices credits concurrent_payments coordinator 2pc -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  failure-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: core-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and start services
        run: |
          docker compose down -v --remove-orphans || true
          docker compose build
          docker compose up -d

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for services
        run: python benchmarks/BCT/wait_for_services.py

      - name: Run failure/rollback tests
        working-directory: benchmarks/BCT
        run: |
          python -m unittest failure_resistance rollback -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  kafka-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: core-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and start services
        run: |
          docker compose down -v --remove-orphans || true
          docker compose build
          docker compose up -d

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for services
        run: python benchmarks/BCT/wait_for_services.py

      - name: Run kafka tests
        working-directory: benchmarks/BCT
        run: |
          python -m unittest kafka_saga -v

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
