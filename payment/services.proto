syntax = "proto3";

package services;

service PaymentService 
{ // Remote Procedure Calls for StockService
  rpc Pay (PayRequest) returns (PayReply);
}

message PayRequest 
{ // Request a payment amount for a user
  string user_id = 1;
  int32  amount  = 2;
}

message PayReply 
{ // Reply back for changes in payment
  bool   success = 1;
  string message = 2;
}
